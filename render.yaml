# ==============================================================================
# Render Blueprint (render.yaml) for Student Community Platform
# ==============================================================================
services:
  # 1. Backend Web Service (AdonisJS v6 API & Socket.io)
  - type: web
    name: student-community-backend
    env: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node build/bin/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: cookie
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DB_CONNECTION
        value: pg
      - key: DB_HOST
        value: db.leowjdfbufhnbgkttxrg.supabase.co
      - key: DB_PORT
        value: "6543"
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres
      - key: SUPABASE_S3_ACCESS_KEY_ID
        value: 7b78423db1803c8ffc27f34b5ede3d4c
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        value: https://leowjdfbufhnbgkttxrg.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads


  # 2. Frontend Static Web Service (React + Vite)
  - type: web
    name: student-community-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
